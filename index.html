<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Thermal Expansion Calculator</title>
  <link rel="manifest" href="/manifest.json">
  <style>
    body { font-family: Arial, sans-serif; max-width: 600px; margin: 40px auto; padding: 20px; }
    .form-group { margin-bottom: 15px; }
    label { display: block; margin-bottom: 5px; font-weight: bold; }
    input { width: 100%; padding: 8px; box-sizing: border-box; }
    button { background-color: #007bff; color: white; padding: 10px 15px; border: none; cursor: pointer; width: 100%; font-size: 16px; }
    .result { margin-top: 20px; padding: 15px; background: #f8f9fa; border: 1px solid #ddd; display: none; }
  </style>
</head>
<body>
  <h2>Thermal Expansion & Stress Calculator</h2>
  <div class="form-group"><label>Length 1 (m):</label><input type="number" id="L1" step="any" value="1.0"></div>
  <div class="form-group"><label>Area 1 (m²):</label><input type="number" id="A1" step="any" value="0.01"></div>
  <div class="form-group"><label>Elastic Modulus 1 (Pa):</label><input type="number" id="E1" step="any" value="200e9"></div>
  <div class="form-group"><label>Coeff. Thermal Expansion 1 (1/K):</label><input type="number" id="alpha1" step="any" value="12e-6"></div>
  <hr>
  <div class="form-group"><label>Length 2 (m):</label><input type="number" id="L2" step="any" value="1.0"></div>
  <div class="form-group"><label>Area 2 (m²):</label><input type="number" id="A2" step="any" value="0.01"></div>
  <div class="form-group"><label>Elastic Modulus 2 (Pa):</label><input type="number" id="E2" step="any" value="100e9"></div>
  <div class="form-group"><label>Coeff. Thermal Expansion 2 (1/K):</label><input type="number" id="alpha2" step="any" value="23e-6"></div>
  <hr>
  <div class="form-group"><label>Temperature Change ΔT (°C or K):</label><input type="number" id="delta_T" step="any" value="50"></div>
  
  <button onclick="calculate()">Calculate Stress</button>

  <div class="result" id="resultsBox">
    <h3>Results</h3>
    <p>Internal Force: <strong id="resForce"></strong></p>
    <p>Material 1 Stress: <strong id="resStress1"></strong></p>
    <p>Material 2 Stress: <strong id="resStress2"></strong></p>
  </div>

  <script>
    async function calculate() {
      const payload = {
        L1: parseFloat(document.getElementById('L1').value),
        A1: parseFloat(document.getElementById('A1').value),
        E1: parseFloat(document.getElementById('E1').value),
        alpha1: parseFloat(document.getElementById('alpha1').value),
        L2: parseFloat(document.getElementById('L2').value),
        A2: parseFloat(document.getElementById('A2').value),
        E2: parseFloat(document.getElementById('E2').value),
        alpha2: parseFloat(document.getElementById('alpha2').value),
        delta_T: parseFloat(document.getElementById('delta_T').value)
      };

      try {
        const response = await fetch('/predict_assembly_stress', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });
        const data = await response.json();
        document.getElementById('resForce').innerText = data.internal_force_kN + ' kN';
        document.getElementById('resStress1').innerText = data.material_1_stress_MPa + ' MPa';
        document.getElementById('resStress2').innerText = data.material_2_stress_MPa + ' MPa';
        document.getElementById('resultsBox').style.display = 'block';
      } catch (err) {
        alert('Error connecting to backend engine.');
      }
    }
  </script>
</body>
</html>
